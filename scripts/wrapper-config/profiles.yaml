# Model Profiles Configuration for MLX Server
# Defines model profiles with quantization settings, KV cache compression, and inference arguments
# Target models for 120B+ serving on Apple Silicon memory-constrained systems

profiles:
  - name: "nemotron-120b"
    model_path: "~/.cache/huggingface/hub/Nemotron-120B-48GB"
    description: "Nemotron 120B optimized for 48GB Apple Silicon"
    memory_estimate_gb: 48.0
    quantization:
      type: "hybrid"
      paths:
        - pattern: "attention.*"
          bits: 8
          group_size: 64
          description: "Attention layers at 8-bit for quality retention"
        - pattern: "ffn.*"
          bits: 4
          group_size: 128
          description: "FFN layers at 4-bit for memory savings"
    kv_cache:
      quantized: true
      bits: 4
    inference_args:
      max_context_length: 2048
      temperature: 0.7
      max_tokens: 4096
      batch_size: 1

  - name: "gpt-oss-120b"
    model_path: "~/.cache/huggingface/hub/GPT-OSS-120B"
    description: "GPT-OSS 120B with hybrid quantization"
    memory_estimate_gb: 48.0
    quantization:
      type: "hybrid"
      paths:
        - pattern: ".*"
          bits: 4
          group_size: 128
          description: "Uniform 4-bit quantization for maximum memory efficiency"
    kv_cache:
      quantized: true
      bits: 4
    inference_args:
      max_context_length: 2048
      temperature: 0.7
      max_tokens: 4096
      batch_size: 1

  - name: "qwen3.5-122b"
    model_path: "~/.cache/huggingface/hub/Qwen3.5-122B"
    description: "Qwen3.5 122B with balanced quantization"
    memory_estimate_gb: 50.0
    quantization:
      type: "hybrid"
      paths:
        - pattern: "attention.*"
          bits: 8
          group_size: 64
          description: "Attention layers at 8-bit"
        - pattern: "ffn.*"
          bits: 4
          group_size: 128
          description: "FFN layers at 4-bit"
    kv_cache:
      quantized: true
      bits: 4
    inference_args:
      max_context_length: 2048
      temperature: 0.7
      max_tokens: 4096
      batch_size: 1

# API key configuration (optional, leave empty to disable auth on admin endpoints)
api_key: ""
# api_key_env_var: "MLX_WRAPPER_API_KEY"  # Uncomment to read from environment variable
